services:
  mysql:
    image: mysql:8.0
    container_name: bd_r4life
    environment:
      MYSQL_ROOT_PASSWORD: 12345
      MYSQL_DATABASE: r4life_db
      MYSQL_USER: user_db
      MYSQL_PASSWORD: 12345
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network
    ports:
      - "3308:3306" 

  flask_api:
    build:

      context: "./Proyecto Integrador R4LIFE/Proyecto Integrador R4LIFE/R4LIFE"
    container_name: api_r4life
    ports:
      - "5050:5000" 
    depends_on:
      - mysql
    networks:
      - app_network
    volumes:
      - "./Proyecto Integrador R4LIFE/Proyecto Integrador R4LIFE/R4LIFE:/app"

networks:
  app_network:
    driver: bridge

volumes:
  mysql_data: